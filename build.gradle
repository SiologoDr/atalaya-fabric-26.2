plugins {
    // Loom descarga Minecraft, lo remapea y crea las tareas runClient / runServer.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // Separa el codigo de cliente del comun: src/main (ambos) y src/client (solo cliente).
    // Asi es imposible referenciar por error una clase de renderizado en el servidor.
    splitEnvironmentSourceSets()

    mods {
        "atalaya" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Sin linea de 'mappings': este Loom usa los mappings oficiales de Mojang
    // por defecto. Yarn no publica para la serie 26.x, asi que los nombres de
    // clases seran los de Mojang y no coincidiran con los de la mayoria de tutoriales.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Minecraft tiene siete variantes de espanol y NO hereda entre ellas: si el
// cliente esta en es_mx y solo existe es_es, se va al ingles. Como el texto es
// el mismo para todas, se generan desde es_es.json en vez de mantener copias.
def variantesEspanol = ['es_mx', 'es_ar', 'es_cl', 'es_ec', 'es_uy', 'es_ve']

processResources {
    inputs.property 'version', project.version
    inputs.property 'variantesEspanol', variantesEspanol
    filteringCharset = 'UTF-8'
    // Sustituye ${version} dentro de fabric.mod.json por la version real.
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }

    doLast {
        def dirLang = new File(destinationDir, 'assets/atalaya/lang')
        def origen = new File(dirLang, 'es_es.json')
        if (!origen.exists()) {
            throw new GradleException("Falta ${origen}: es la fuente de las variantes de espanol.")
        }
        def texto = origen.getText('UTF-8')
        variantesEspanol.each { variante ->
            new File(dirLang, "${variante}.json").write(texto, 'UTF-8')
        }
        logger.lifecycle("[atalaya] Generadas ${variantesEspanol.size()} variantes de espanol desde es_es.json")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25   // Minecraft 26.2 corre sobre Java 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
