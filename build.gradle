plugins {
    id 'java'
    // Crea la tarea 'runServer': descarga Paper y levanta un servidor de pruebas
    // con este plugin ya cargado. Ideal para ver tus cambios rapido.
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

group = project.group
version = project.version

repositories {
    mavenCentral()
    // Repositorio oficial de Paper (de aqui sale la API contra la que compilamos)
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // paper-api es 'compileOnly': el servidor Paper ya la trae en runtime,
    // por eso NO se empaqueta dentro de nuestro .jar.
    // El patron 26.2.build.+ resuelve automaticamente al ultimo build de la 26.2.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'
}

java {
    // Minecraft/Paper 26.2 requiere Java 25.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    // Reemplaza ${version} dentro de plugin.yml por la version real del proyecto
    filesMatching('plugin.yml') {
        expand props
    }
}

// Servidor de pruebas: ./gradlew runServer
tasks.runServer {
    // Version de Minecraft/Paper que se descargara para probar.
    minecraftVersion('26.2')
}
