# ==========================================================
#  Configuracion del plugin Atalaya
# ==========================================================

radiacion:
  # Activa/desactiva la mecanica de radiacion (se puede cambiar con /atalaya menu).
  activa: true

  # Cada cuantos ticks se revisa la cercania a las geodas (20 ticks = 1 segundo).
  intervalo-ticks: 20

  # Distancia (en bloques) a partir de la cual la radiacion desaparece.
  # Dentro de este radio se reparten los 4 niveles segun lo cerca que estes.
  distancia-maxima: 12

  # Dano por nivel de radiacion, en puntos de vida (2 = 1 corazon).
  # Nivel 4 = muy pegado a la amatista.  Nivel 1 = justo al borde del alcance.
  dano-por-nivel:
    1: 1.0
    2: 2.0
    3: 3.0
    4: 4.0

  # Lentitud por nivel (fraccion de velocidad que se resta). Acumulado:
  #   nivel 1 = 10%, 2 = 20%, 3 = 30%, 4 = 50%.
  # Va integrada en el efecto de radiacion (no aparece un efecto de lentitud aparte).
  # Al alejarse el nivel baja y la lentitud baja con el.
  lentitud-por-nivel:
    1: 0.10
    2: 0.20
    3: 0.30
    4: 0.50

  # --- Optimizacion del escaneo de geodas ---
  # Rango de altura donde se buscan geodas al escanear cada chunk (una sola vez).
  # Las geodas naturales generan aqui. La amatista que un jugador coloque fuera
  # de este rango se detecta igual por evento mientras el chunk este cargado.
  escaneo-y-min: -64
  escaneo-y-max: 40

hazmat:
  # Activa/desactiva el crafteo del traje (y su aparicion en el libro de recetas).
  # Se puede cambiar con /atalaya menu.
  crafteo-activo: true
