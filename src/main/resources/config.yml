# ==========================================================
#  Configuracion del plugin Atalaya
# ==========================================================

radiacion:
  # Cada cuantos ticks se revisa la cercania a las geodas (20 ticks = 1 segundo).
  intervalo-ticks: 20

  # Distancia (en bloques) a partir de la cual la radiacion desaparece.
  # Dentro de este radio se reparten los 4 niveles segun lo cerca que estes.
  distancia-maxima: 12

  # Dano por nivel de radiacion, en puntos de vida (2 = 1 corazon).
  # Nivel 4 = muy pegado a la amatista.  Nivel 1 = justo al borde del alcance.
  dano-por-nivel:
    1: 1.0
    2: 2.0
    3: 3.0
    4: 4.0
